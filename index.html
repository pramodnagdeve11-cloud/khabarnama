<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>खबरनामा — हर विषय की खबर, हर भाषा में</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;700&family=Hind:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181611; --navy:#1f2a44; --navy-deep:#141b2e;
    --paper:#f5f1e6; --paper-dim:#ece5d2;
    --marigold:#e2992f; --marigold-deep:#b8730f;
    --red:#a53324; --teal:#2f7d6b;
    --line:#d8cfb5; --rule: 1px solid var(--line);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:'Hind','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Nastaliq Urdu',sans-serif;
    line-height:1.6;}
  h1,h2,h3,.headline{font-family:'Noto Serif Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Nastaliq Urdu',serif;margin:0;color:var(--ink);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  img,svg{display:block;max-width:100%;}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--marigold-deep);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}}

  .masthead{background:var(--navy-deep);color:var(--paper);padding:18px 24px 14px;}
  .masthead-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
  .brand{font-size:clamp(2.1rem,5vw,3.1rem);font-weight:700;letter-spacing:0.5px;}
  .brand span{color:var(--marigold);}
  .brand-sub{color:#a7a08a;font-size:0.85rem;margin-top:2px;}
  .meta-line{font-size:0.85rem;color:#c9c2ad;display:flex;gap:16px;flex-wrap:wrap;}
  .masthead-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .admin-toggle{border:1px solid #3a4560;background:transparent;color:#c9c2ad;padding:6px 12px;border-radius:3px;font-size:0.82rem;}
  .admin-toggle:hover{border-color:var(--marigold);color:var(--marigold);}
  .lang-select{border:1px solid #3a4560;background:var(--navy-deep);color:var(--paper);padding:6px 10px;border-radius:3px;font-size:0.82rem;}

  .stats-strip{background:var(--navy);color:var(--paper);display:flex;flex-wrap:wrap;}
  .stats-strip-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;}
  .stat-item{flex:1;min-width:150px;padding:10px 20px;border-inline-end:1px solid rgba(245,241,230,0.15);font-size:0.82rem;color:#c9c2ad;display:flex;justify-content:space-between;gap:8px;}
  .stat-item strong{color:var(--paper);font-family:'Noto Serif Devanagari',serif;font-size:0.95rem;}

  .ticker-wrap{background:var(--marigold);border-bottom:1px solid var(--marigold-deep);overflow:hidden;display:flex;}
  .ticker-label{flex:none;background:var(--red);color:#fff;font-weight:600;font-size:0.85rem;padding:8px 16px;display:flex;align-items:center;}
  .ticker-track{flex:1;overflow:hidden;position:relative;white-space:nowrap;display:flex;align-items:center;}
  .ticker-items{display:inline-flex;gap:48px;padding-inline-start:100%;animation:scroll-left 36s linear infinite;color:var(--navy-deep);font-size:0.9rem;font-weight:500;}
  @keyframes scroll-left{from{transform:translateX(0);}to{transform:translateX(-100%);}}
  @media (prefers-reduced-motion: reduce){.ticker-items{animation:none;padding-inline-start:16px;}}

  .cat-nav{background:var(--paper-dim);border-bottom:var(--rule);}
  .cat-nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 24px;}
  .cat-btn{background:none;border:none;padding:12px 14px;font-size:0.92rem;color:#4b4736;white-space:nowrap;border-bottom:2px solid transparent;}
  .cat-btn:hover{color:var(--ink);}
  .cat-btn.active{color:var(--navy-deep);border-bottom-color:var(--marigold-deep);font-weight:600;}

  .wrap{max-width:1200px;margin:0 auto;padding:32px 24px 60px;}
  .top-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:32px;align-items:start;}
  @media (max-width:860px){.top-grid{grid-template-columns:1fr;}}

  .hero{border:var(--rule);background:#fff;animation:hero-in 0.6s ease both;cursor:pointer;}
  @keyframes hero-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.hero{animation:none;}}
  .hero-art{height:260px;position:relative;background:radial-gradient(circle at 15% 25%, rgba(226,153,47,0.55), transparent 55%),radial-gradient(circle at 85% 75%, rgba(31,42,68,0.65), transparent 55%),linear-gradient(135deg,var(--navy) 0%, var(--navy-deep) 100%);display:flex;align-items:flex-end;padding:20px;}
  .hero-tag{background:var(--red);color:#fff;font-size:0.78rem;font-weight:600;padding:4px 10px;border-radius:2px;}
  .hero-body{padding:22px;}
  .hero-body .headline{font-size:clamp(1.5rem,3vw,2.05rem);line-height:1.3;}
  .hero-body p{color:#4b4736;margin:12px 0 0;font-size:1rem;}
  .byline{color:#7a7457;font-size:0.82rem;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .play-circle{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--navy-deep);}

  .live-panel{border:var(--rule);background:#fff;}
  .live-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:var(--rule);background:var(--navy-deep);color:var(--paper);}
  .live-head h2{font-size:1.05rem;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#5fd18a;display:inline-block;margin-inline-end:6px;box-shadow:0 0 0 0 rgba(95,209,138,0.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,209,138,0.55);}70%{box-shadow:0 0 0 8px rgba(95,209,138,0);}100%{box-shadow:0 0 0 0 rgba(95,209,138,0);}}
  .refresh-btn{background:transparent;border:1px solid #445;color:var(--paper);font-size:0.76rem;padding:4px 9px;border-radius:3px;}
  .refresh-btn:hover{border-color:var(--marigold);color:var(--marigold);}
  .live-list{list-style:none;margin:0;padding:0;}
  .live-list li{padding:12px 16px;border-bottom:var(--rule);font-size:0.9rem;}
  .live-list li:last-child{border-bottom:none;}
  .live-time{color:var(--marigold-deep);font-size:0.76rem;font-weight:600;display:block;margin-bottom:3px;}
  .live-note{padding:10px 16px;font-size:0.78rem;color:#8a836a;border-top:var(--rule);}

  .trending-panel{border:var(--rule);background:#fff;margin-top:22px;}
  .trending-head{padding:12px 16px;border-bottom:var(--rule);background:var(--red);color:#fff;font-size:1rem;font-family:'Noto Serif Devanagari',serif;}
  .trending-list{list-style:none;margin:0;padding:0;counter-reset:trend;}
  .trending-list li{padding:10px 16px;border-bottom:var(--rule);font-size:0.88rem;display:flex;gap:10px;align-items:baseline;cursor:pointer;}
  .trending-list li:last-child{border-bottom:none;}
  .trending-list li::before{counter-increment:trend;content:counter(trend);font-family:'Noto Serif Devanagari',serif;font-size:1rem;color:var(--marigold-deep);flex:none;width:1.2em;}
  .trending-list li:hover{background:var(--paper-dim);}

  .capsule{border:var(--rule);background:#fff;margin-top:22px;}
  .capsule-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:var(--rule);background:var(--teal);color:#fff;}
  .capsule-head h2{font-size:1rem;}
  .capsule-body{padding:16px;font-size:0.92rem;color:#332f22;}
  .capsule-tag{display:inline-block;font-size:0.72rem;color:var(--teal);font-weight:600;margin-bottom:6px;}

  .section-title{display:flex;align-items:baseline;gap:12px;margin:44px 0 18px;}
  .section-title h2{font-size:1.5rem;}
  .section-title .rule{flex:1;border-top:var(--rule);}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}
  .card{border:var(--rule);background:#fff;display:flex;flex-direction:column;transition:border-color 0.15s ease;cursor:pointer;}
  .card-art{height:120px;position:relative;background:linear-gradient(135deg, var(--card-a,#c99a4b), var(--card-b,#1f2a44));}
  .card-art .play-circle{width:38px;height:38px;font-size:0.95rem;}
  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-cat{font-size:0.74rem;color:var(--marigold-deep);font-weight:600;}
  .card h3{font-size:1.08rem;line-height:1.35;}
  .card p{margin:0;color:#4b4736;font-size:0.88rem;flex:1;}
  .card .byline{margin-top:auto;}
  .card:hover{border-color:var(--marigold-deep);}
  .stat-inline{font-size:0.76rem;color:#8a836a;display:flex;gap:10px;}

  .empty-state{border:var(--rule);border-style:dashed;padding:30px;text-align:center;color:#8a836a;}

  .subject-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:18px;}
  .subject-tile{border:var(--rule);background:#fff;padding:14px;display:flex;flex-direction:column;gap:6px;}
  .subject-tile strong{font-family:'Noto Serif Devanagari',serif;font-size:1rem;}
  .subject-tile span{font-size:0.78rem;color:#8a836a;}
  .follow-btn{margin-top:4px;align-self:flex-start;border:1px solid var(--line);background:var(--paper);padding:5px 10px;font-size:0.76rem;border-radius:3px;color:#4b4736;}
  .follow-btn.on{background:var(--marigold);border-color:var(--marigold-deep);color:var(--navy-deep);font-weight:600;}

  .admin-panel{margin-top:48px;border:1px solid var(--navy);background:#fff;display:none;}
  .admin-panel.open{display:block;}
  .admin-head{background:var(--navy-deep);color:var(--paper);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;}
  .admin-form{padding:20px;display:grid;gap:14px;}
  .field{display:grid;gap:5px;}
  .field label{font-size:0.82rem;color:#4b4736;font-weight:600;}
  .field input,.field select,.field textarea{border:1px solid var(--line);padding:9px 10px;font-family:inherit;font-size:0.92rem;background:var(--paper);color:var(--ink);}
  .field textarea{min-height:90px;resize:vertical;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.two-col{grid-template-columns:1fr;}}
  .publish-btn{background:var(--red);color:#fff;border:none;padding:11px 18px;font-size:0.95rem;font-weight:600;justify-self:start;}
  .publish-btn:hover{background:#8a2a1e;}
  .admin-hint{color:#8a836a;font-size:0.8rem;}
  .close-admin{background:none;border:none;color:var(--paper);font-size:1.1rem;line-height:1;}
  .status-msg{font-size:0.85rem;padding:0 20px 16px;color:var(--marigold-deep);min-height:1em;}

  footer{border-top:var(--rule);padding:26px 24px;text-align:center;color:#8a836a;font-size:0.82rem;}

  /* ===== Modal ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,27,46,0.72);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;max-width:720px;width:100%;border:1px solid var(--navy);margin-top:20px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--navy-deep);color:var(--paper);}
  .modal-video{aspect-ratio:16/9;background:#000;}
  .modal-video iframe{width:100%;height:100%;border:none;}
  .modal-body{padding:22px;}
  .modal-body .card-cat{margin-bottom:8px;}
  .modal-body h1{font-size:1.5rem;line-height:1.35;margin-bottom:12px;}
  .modal-body p{color:#332f22;font-size:0.96rem;}
  .action-row{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap;}
  .action-btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;font-size:0.86rem;border-radius:3px;color:#4b4736;}
  .action-btn.liked{background:var(--marigold);border-color:var(--marigold-deep);color:var(--navy-deep);font-weight:600;}
  .action-btn:hover{border-color:var(--marigold-deep);}
  .comments-section{border-top:var(--rule);margin-top:18px;padding-top:18px;}
  .comment-item{border-bottom:var(--rule);padding:10px 0;font-size:0.88rem;}
  .comment-item strong{font-family:'Noto Serif Devanagari',serif;font-size:0.92rem;}
  .comment-time{color:#8a836a;font-size:0.74rem;margin-inline-start:8px;}
  .comment-form{display:grid;gap:8px;margin-top:14px;}
  .comment-form input,.comment-form textarea{border:1px solid var(--line);padding:8px 10px;font-family:inherit;font-size:0.88rem;background:var(--paper);}
  .comment-form textarea{min-height:60px;}
  .comment-form button{background:var(--navy);color:#fff;border:none;padding:9px 14px;font-size:0.86rem;justify-self:start;}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="brand">ख<span>बर</span>नामा</div>
      <div class="brand-sub" id="txt-tagline">—</div>
      <div class="meta-line"><span id="today-date">—</span><span id="txt-edition">—</span></div>
    </div>
    <div class="masthead-actions">
      <select class="lang-select" id="langSelect" aria-label="Language"></select>
      <button class="admin-toggle" id="adminToggleBtn"></button>
    </div>
  </div>
</header>

<div class="stats-strip"><div class="stats-strip-inner">
  <div class="stat-item"><span id="txt-stat-total"></span><strong id="statTotal">—</strong></div>
  <div class="stat-item"><span id="txt-stat-cats"></span><strong id="statCats">—</strong></div>
  <div class="stat-item"><span id="txt-stat-last"></span><strong id="statLastUpdate">—</strong></div>
  <div class="stat-item" style="border-inline-end:none;"><span id="txt-stat-next"></span><strong id="statNext">—</strong></div>
</div></div>

<div class="ticker-wrap">
  <div class="ticker-label" id="txt-breaking"></div>
  <div class="ticker-track"><div class="ticker-items" id="tickerItems">…</div></div>
</div>

<nav class="cat-nav"><div class="cat-nav-inner" id="catNav"></div></nav>

<main class="wrap">
  <section class="top-grid">
    <article class="hero" id="heroCard"></article>
    <aside>
      <div class="live-panel">
        <div class="live-head"><h2><span class="live-dot" aria-hidden="true"></span><span id="txt-live-title"></span></h2>
          <button class="refresh-btn" id="refreshBtn"></button></div>
        <ul class="live-list" id="liveList"></ul>
        <div class="live-note" id="liveNote"></div>
      </div>
      <div class="trending-panel">
        <div class="trending-head" id="txt-trending-title"></div>
        <ul class="trending-list" id="trendingList"></ul>
      </div>
      <div class="capsule">
        <div class="capsule-head"><h2 id="txt-capsule-title"></h2><span id="capsuleTime" style="font-size:0.76rem;"></span></div>
        <div class="capsule-body"><div class="capsule-tag" id="capsuleTag"></div><div id="capsuleText"></div></div>
      </div>
    </aside>
  </section>

  <div class="section-title"><h2 id="txt-section-subjects"></h2><div class="rule"></div></div>
  <div class="subject-strip" id="subjectStrip"></div>

  <div class="section-title"><h2 id="gridTitle"></h2><div class="rule"></div></div>
  <section class="grid" id="articleGrid"></section>

  <section class="admin-panel" id="adminPanel">
    <div class="admin-head"><strong id="txt-admin-title"></strong><button class="close-admin" id="closeAdminBtn" aria-label="Close">✕</button></div>
    <form class="admin-form" id="newsForm">
      <div class="two-col">
        <div class="field"><label id="lbl-title" for="f-title"></label><input type="text" id="f-title" required maxlength="120"></div>
        <div class="field"><label id="lbl-cat" for="f-cat"></label><select id="f-cat"></select></div>
      </div>
      <div class="field"><label id="lbl-summary" for="f-summary"></label><textarea id="f-summary" required maxlength="220"></textarea></div>
      <div class="field"><label id="lbl-body" for="f-body"></label><textarea id="f-body" style="min-height:130px"></textarea></div>
      <div class="two-col">
        <div class="field"><label id="lbl-author" for="f-author"></label><input type="text" id="f-author" maxlength="60"></div>
        <div class="field"><label id="lbl-video" for="f-video"></label><input type="text" id="f-video"></div>
      </div>
      <button type="submit" class="publish-btn" id="publishBtn"></button>
      <div class="admin-hint" id="txt-admin-hint"></div>
    </form>
    <div class="status-msg" id="statusMsg"></div>
  </section>
</main>

<footer id="footerText"></footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head"><strong id="modalCat"></strong><button class="close-admin" id="closeModalBtn" aria-label="Close">✕</button></div>
    <div class="modal-video" id="modalVideo" style="display:none;"></div>
    <div class="modal-body">
      <h1 id="modalTitle"></h1>
      <div class="byline" id="modalByline"></div>
      <p id="modalBody"></p>
      <div class="action-row">
        <button class="action-btn" id="likeBtn">👍 <span id="likeCount">0</span></button>
        <button class="action-btn" id="shareBtn"></button>
        <span class="stat-inline" id="viewCountLine"></span>
      </div>
      <div class="comments-section">
        <h2 id="txt-comments-title" style="font-size:1.05rem;"></h2>
        <div id="commentsList"></div>
        <form class="comment-form" id="commentForm">
          <input type="text" id="c-name" maxlength="40">
          <textarea id="c-text" maxlength="300"></textarea>
          <button type="submit" id="postCommentBtn"></button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const CAT_KEYS = ["national","international","business","sports","entertainment","tech","health","education","science","career"];

  const CATNAMES = {
    hi:{national:"राष्ट्रीय",international:"अंतरराष्ट्रीय",business:"व्यापार",sports:"खेल",entertainment:"मनोरंजन",tech:"तकनीक",health:"स्वास्थ्य",education:"शिक्षा",science:"विज्ञान",career:"करियर"},
    en:{national:"National",international:"International",business:"Business",sports:"Sports",entertainment:"Entertainment",tech:"Technology",health:"Health",education:"Education",science:"Science",career:"Career"},
    mr:{national:"राष्ट्रीय",international:"आंतरराष्ट्रीय",business:"व्यापार",sports:"क्रीडा",entertainment:"मनोरंजन",tech:"तंत्रज्ञान",health:"आरोग्य",education:"शिक्षण",science:"विज्ञान",career:"करिअर"},
    bn:{national:"জাতীয়",international:"আন্তর্জাতিক",business:"ব্যবসা",sports:"খেলাধুলা",entertainment:"বিনোদন",tech:"প্রযুক্তি",health:"স্বাস্থ্য",education:"শিক্ষা",science:"বিজ্ঞান",career:"কর্মজীবন"},

    $('#txt-stat-next').textContent = tr('stat_next');
    $('#txt-breaking').textContent = tr('breaking');
    $('#txt-section-subjects').textContent = tr('section_subjects');
    $('#txt-live-title').textContent = tr('live_title');
    $('#refreshBtn').textContent = tr('refresh');
    $('#txt-trending-title').textContent = tr('trending_title');
    $('#txt-capsule-title').textContent = tr('capsule_title');
    $('#txt-admin-title').textContent = tr('admin_title');
    $('#lbl-title').textContent = tr('lbl_title');
    $('#lbl-cat').textContent = tr('lbl_cat');
    $('#lbl-summary').textContent = tr('lbl_summary');
    $('#lbl-body').textContent = tr('lbl_body');
    $('#lbl-author').textContent = tr('lbl_author');
    $('#lbl-video').textContent = tr('lbl_video');
    $('#publishBtn').textContent = tr('publish');
    $('#txt-admin-hint').textContent = tr('admin_hint');
    $('#footerText').textContent = tr('footer');
    $('#txt-comments-title').textContent = tr('comments_title');
    $('#postCommentBtn').textContent = tr('post_comment');
    $('#c-name').placeholder = tr('c_name_ph');
    $('#c-text').placeholder = tr('c_text_ph');
    $('#shareBtn').textContent = '🔗 ' + tr('share');
    $('#f-author').placeholder = tr('byline_desk');

    const catSelect = $('#f-cat');
    catSelect.innerHTML = CAT_KEYS.map(k=>`<option value="${k}">${catName(k)}</option>`).join('');

    buildCatNav(); buildSubjectStrip(); renderHero(); renderGrid(); renderTicker(); renderTrending(); renderLive();
  }

  function buildCatNav(){
    const all = ["cat_all", ...CAT_KEYS];
    $('#catNav').innerHTML = all.map(k => `<button class="cat-btn${k===activeCat?' active':''}" data-cat="${k}">${k==='cat_all'?tr('cat_all'):catName(k)}</button>`).join('');
    $('#catNav').querySelectorAll('.cat-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; buildCatNav(); renderGrid(); });
    });
  }

  function buildSubjectStrip(){
    $('#subjectStrip').innerHTML = CAT_KEYS.map(k=>{
      const count = articles.filter(a=>a.cat===k).length;
      const isFollowed = follows.includes(k);
      return `<div class="subject-tile">
        <strong>${catName(k)}</strong><span>${count} · ${tr('views').split(' ')[0]||''}</span>
        <button class="follow-btn${isFollowed?' on':''}" data-cat="${k}">${isFollowed?('✓ '+tr('following')):tr('follow')}</button>
      </div>`;
    }).join('');
    $('#subjectStrip').querySelectorAll('.follow-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const k = btn.dataset.cat;
        if(follows.includes(k)) follows = follows.filter(c=>c!==k); else follows.push(k);
        await saveFollows();
        buildSubjectStrip();
      });
    });
  }

  async function loadFollows(){
    try{
      const res = await window.storage.get('khabarnama:follows', false);
      if(res && res.value) follows = JSON.parse(res.value);
    }catch(e){ follows = []; }
  }
  async function saveFollows(){
    try{ await window.storage.set('khabarnama:follows', JSON.stringify(follows), false); }catch(e){}
  }

  function renderHero(){
    const featured = articles.find(a=>a.featured) || articles[0];
    if(!featured){ $('#heroCard').innerHTML = `<div class="empty-state">${tr('empty_state')}</div>`; return; }
    const vid = youtubeId(featured.video);
    $('#heroCard').innerHTML = `
      <div class="hero-art"><span class="hero-tag">${tr('hero_tag')}</span>${vid?'<div class="play-badge"><div class="play-circle">▶</div></div>':''}</div>
      <div class="hero-body">
        <div class="card-cat">${catName(featured.cat)}</div>
        <h1 class="headline">${escapeHtml(featured.title)}</h1>
        <p>${escapeHtml(featured.summary)}</p>
        <div class="byline">${escapeHtml(featured.author||tr('byline_desk'))} · ${escapeHtml(featured.time||tr('time_now'))} · ${(viewCounts[featured.id]||0)} ${tr('views')}</div>
      </div>`;
    $('#heroCard').onclick = ()=> openModal(featured.id);
  }

  function renderGrid(){
    const list = activeCat === "cat_all" ? articles : articles.filter(a=>a.cat===activeCat);
    $('#gridTitle').textContent = activeCat === "cat_all" ? tr('section_all') : tr('section_cat').replace('{cat}', catName(activeCat));
    if(list.length===0){ $('#articleGrid').innerHTML = `<div class="empty-state">${tr('empty_state')}</div>`; return; }
    $('#articleGrid').innerHTML = list.map((a,i)=>{
      const catIndex = CAT_KEYS.indexOf(a.cat);
      const [ga,gb] = gradientPairs[(catIndex>=0?catIndex:i) % gradientPairs.length];
      const vid = youtubeId(a.video);
      return `<article class="card" data-id="${a.id}">
        <div class="card-art" style="--card-a:${ga};--card-b:${gb}">${vid?'<div class="play-badge"><div class="play-circle">▶</div></div>':''}</div>
        <div class="card-body">
          <div class="card-cat">${catName(a.cat)}</div>
          <h3>${escapeHtml(a.title)}</h3>
          <p>${escapeHtml(a.summary)}</p>
          <div class="stat-inline"><span>👁 ${viewCounts[a.id]||0}</span><span>👍 ${likeCounts[a.id]||0}</span></div>
          <div class="byline">${escapeHtml(a.author||tr('byline_desk'))} · ${escapeHtml(a.time||tr('time_now'))}</div>
        </div>
      </article>`;
    }).join('');
    $('#articleGrid').querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', ()=> openModal(card.dataset.id));
    });
  }

  function renderTicker(){
    const heads = articles.slice(0,7).map(a=>`${catName(a.cat)}: ${a.title}`);
    $('#tickerItems').textContent = heads.join('   •   ') || '';
  }

  function renderTrending(){
    const ranked = [...articles].sort((a,b)=>((viewCounts[b.id]||0)+(likeCounts[b.id]||0)*2)-((viewCounts[a.id]||0)+(likeCounts[a.id]||0)*2)).slice(0,5);
    $('#trendingList').innerHTML = ranked.map(a=>`<li data-id="${a.id}">${escapeHtml(a.title)}</li>`).join('');
    $('#trendingList').querySelectorAll('li').forEach(li=> li.addEventListener('click', ()=> openModal(li.dataset.id)));
  }

  function renderLive(){
    if(liveItems.length===0){ $('#liveList').innerHTML = '<li>…</li>'; return; }
    $('#liveList').innerHTML = liveItems.map(item=>`<li><span class="live-time">${item.time}</span>${escapeHtml(item.text)}</li>`).join('');
  }
  function pushLive(text){
    liveItems.unshift({text, time:nowLabel()});
    liveItems = liveItems.slice(0,8);
    renderLive();
  }

  function renderStats(){
    $('#statTotal').textContent = articles.length;
    $('#statCats').textContent = CAT_KEYS.length;
    $('#statLastUpdate').textContent = nowLabel();
  }
  function startCountdown(seconds){
    let remaining = seconds;
    if(countdownTimer) clearInterval(countdownTimer);
    const tick = ()=>{
      const m = Math.floor(remaining/60), s = remaining%60;
      $('#statNext').textContent = m + ':' + String(s).padStart(2,'0');
      remaining = remaining<=0 ? seconds : remaining-1;
    };
    tick();
    countdownTimer = setInterval(tick, 1000);
  }
  function showCapsule(){
    const item = knowledgePool[Math.floor(Math.random()*knowledgePool.length)];
    $('#capsuleTag').textContent = item.tag;
    $('#capsuleText').textContent = item.text;
    $('#capsuleTime').textContent = nowLabel();
  }

  async function fetchAutoUpdate(){
    $('#liveNote').textContent = '…';
    try{
      const feedUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://feeds.bbci.co.uk/hindi/india/rss.xml');
      const res = await fetch(feedUrl);
      if(!res.ok) throw new Error('feed unavailable');
      const data = await res.json();
      if(data && Array.isArray(data.items) && data.items.length){
        data.items.slice(0,3).forEach(item=> pushLive(item.title));
        $('#liveNote').textContent = tr('note_live');
      } else throw new Error('empty feed');
    }catch(err){
      pushLive(liveHeadlinePool[Math.floor(Math.random()*liveHeadlinePool.length)]);
      $('#liveNote').textContent = tr('note_fallback');
    }
    renderTicker(); renderStats(); startCountdown(180);
  }
  function scheduleAuto(){
    if(autoTimer) clearInterval(autoTimer);
    autoTimer = setInterval(fetchAutoUpdate, 3*60*1000);
    if(capsuleTimer) clearInterval(capsuleTimer);
    capsuleTimer = setInterval(showCapsule, 45*1000);
  }

  async function loadArticles(){
    try{
      const res = await window.storage.get('khabarnama:articles', true);
      if(res && res.value){ articles = [...JSON.parse(res.value), ...seedArticles]; return; }
    }catch(e){}
    articles = [...seedArticles];
  }
  async function saveArticles(customOnly){
    try{ await window.storage.set('khabarnama:articles', JSON.stringify(customOnly), true); }catch(e){}
  }
  function getCustomArticles(){ return articles.filter(a=>!a.id.startsWith('seed')); }

  async function loadEngagement(){
    try{
      const res = await window.storage.get('khabarnama:engagement', true);
      if(res && res.value){ const d = JSON.parse(res.value); viewCounts=d.views||{}; likeCounts=d.likes||{}; }
    }catch(e){}
    try{
      const res2 = await window.storage.get('khabarnama:comments', true);
      if(res2 && res2.value) comments = JSON.parse(res2.value);
    }catch(e){}
  }
  async function saveEngagement(){
    try{ await window.storage.set('khabarnama:engagement', JSON.stringify({views:viewCounts, likes:likeCounts}), true); }catch(e){}
  }
  async function saveComments(){
    try{ await window.storage.set('khabarnama:comments', JSON.stringify(comments), true); }catch(e){}
  }

  // ---- Modal ----
  function openModal(id){
    const a = articles.find(x=>x.id===id);
    if(!a) return;
    activeArticleId = id;
    viewCounts[id] = (viewCounts[id]||0) + 1;
    saveEngagement();

    $('#modalCat').textContent = catName(a.cat);
    $('#modalTitle').textContent = a.title;
    $('#modalByline').textContent = `${a.author||tr('byline_desk')} · ${a.time||tr('time_now')}`;
    $('#modalBody').textContent = a.body || a.summary;

    const vid = youtubeId(a.video);
    const videoBox = $('#modalVideo');
    if(vid){ videoBox.style.display='block'; videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen title="${escapeHtml(a.title)}"></iframe>`; }
    else { videoBox.style.display='none'; videoBox.innerHTML=''; }

    $('#likeCount').textContent = likeCounts[id]||0;
    $('#likeBtn').classList.toggle('liked', likedByMe.has(id));
    $('#viewCountLine').textContent = `👁 ${viewCounts[id]} ${tr('views')}`;

    renderComments(id);
    $('#modalOverlay').classList.add('open');
    renderGrid(); renderHero(); renderTrending();
  }
  function closeModal(){
    $('#modalOverlay').classList.remove('open');
    $('#modalVideo').innerHTML = '';
    activeArticleId = null;
  }
  $('#closeModalBtn').addEventListener('click', closeModal);
  $('#modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

  $('#likeBtn').addEventListener('click', async ()=>{
    if(!activeArticleId || likedByMe.has(activeArticleId)) return;
    likedByMe.add(activeArticleId);
    likeCounts[activeArticleId] = (likeCounts[activeArticleId]||0)+1;
    $('#likeCount').textContent = likeCounts[activeArticleId];
    $('#likeBtn').classList.add('liked');
    await saveEngagement();
    renderTrending();
  });

  $('#shareBtn').addEventListener('click', async ()=>{
    const a = articles.find(x=>x.id===activeArticleId);
    const shareText = a ? a.title : 'खबरनामा';
    try{
      if(navigator.share){ await navigator.share({title:shareText, text:shareText}); return; }
    }catch(e){}
    try{ await navigator.clipboard.writeText(shareText); }catch(e){}
    const btn = $('#shareBtn');
    const original = btn.textContent;
    btn.textContent = '✓ ' + tr('share_done');
    setTimeout(()=> btn.textContent = original, 2000);
  });

  function renderComments(id){
    const list = comments[id] || [];
    $('#commentsList').innerHTML = list.length ? list.map(c=>`
      <div class="comment-item"><strong>${escapeHtml(c.name)}</strong><span class="comment-time">${c.time}</span><div>${escapeHtml(c.text)}</div></div>
    `).join('') : `<div style="color:#8a836a;font-size:0.85rem;">${tr('no_comments')}</div>`;
  }
  $('#commentForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!activeArticleId) return;
    const name = $('#c-name').value.trim() || tr('c_name_ph');
    const text = $('#c-text').value.trim();
    if(!text) return;
    if(!comments[activeArticleId]) comments[activeArticleId] = [];
    comments[activeArticleId].unshift({name, text, time:nowLabel()});
    await saveComments();
    renderComments(activeArticleId);
    $('#c-text').value = '';
  });

  // ---- Admin ----
  const adminPanel = $('#adminPanel');
  $('#adminToggleBtn').addEventListener('click', ()=>{
    adminPanel.classList.toggle('open');
    if(adminPanel.classList.contains('open')) adminPanel.scrollIntoView({behavior:'smooth', block:'start'});
  });
  $('#closeAdminBtn').addEventListener('click', ()=> adminPanel.classList.remove('open'));

  $('#newsForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const title = $('#f-title').value.trim();
    const summary = $('#f-summary').value.trim();
    const body = $('#f-body').value.trim();
    const author = $('#f-author').value.trim();
    const video = $('#f-video').value.trim();
    const cat = $('#f-cat').value;
    if(!title || !summary) return;

    const newArticle = { id:'custom-'+Date.now(), title, summary, body, cat, author: author||tr('byline_desk'), time: tr('time_now'), featured:true, video };
    articles.forEach(a=>a.featured=false);
    articles.unshift(newArticle);
    await saveArticles(getCustomArticles());

    renderHero(); renderGrid(); renderTicker(); renderStats(); buildSubjectStrip(); renderTrending();
    $('#statusMsg').textContent = tr('publish_success');
    $('#newsForm').reset();
    setTimeout(()=> $('#statusMsg').textContent='', 3500);
  });

  $('#refreshBtn').addEventListener('click', fetchAutoUpdate);

  (async function init(){
    $('#today-date').textContent = new Date().toLocaleDateString('hi-IN', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    await loadLangPref();
    setupLangSelect();
    await loadArticles();
    await loadEngagement();
    await loadFollows();
    applyLanguage();
    showCapsule();
    await fetchAutoUpdate();
    scheduleAuto();
  })();

})();
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>खबरनामा — हर विषय की खबर, हर भाषा में</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;700&family=Hind:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181611; --navy:#1f2a44; --navy-deep:#141b2e;
    --paper:#f5f1e6; --paper-dim:#ece5d2;
    --marigold:#e2992f; --marigold-deep:#b8730f;
    --red:#a53324; --teal:#2f7d6b;
    --line:#d8cfb5; --rule: 1px solid var(--line);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:'Hind','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Nastaliq Urdu',sans-serif;
    line-height:1.6;}
  h1,h2,h3,.headline{font-family:'Noto Serif Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Nastaliq Urdu',serif;margin:0;color:var(--ink);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  img,svg{display:block;max-width:100%;}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--marigold-deep);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}}

  .masthead{background:var(--navy-deep);color:var(--paper);padding:18px 24px 14px;}
  .masthead-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
  .brand{font-size:clamp(2.1rem,5vw,3.1rem);font-weight:700;letter-spacing:0.5px;}
  .brand span{color:var(--marigold);}
  .brand-sub{color:#a7a08a;font-size:0.85rem;margin-top:2px;}
  .meta-line{font-size:0.85rem;color:#c9c2ad;display:flex;gap:16px;flex-wrap:wrap;}
  .masthead-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .admin-toggle{border:1px solid #3a4560;background:transparent;color:#c9c2ad;padding:6px 12px;border-radius:3px;font-size:0.82rem;}
  .admin-toggle:hover{border-color:var(--marigold);color:var(--marigold);}
  .lang-select{border:1px solid #3a4560;background:var(--navy-deep);color:var(--paper);padding:6px 10px;border-radius:3px;font-size:0.82rem;}

  .stats-strip{background:var(--navy);color:var(--paper);display:flex;flex-wrap:wrap;}
  .stats-strip-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;}
  .stat-item{flex:1;min-width:150px;padding:10px 20px;border-inline-end:1px solid rgba(245,241,230,0.15);font-size:0.82rem;color:#c9c2ad;display:flex;justify-content:space-between;gap:8px;}
  .stat-item strong{color:var(--paper);font-family:'Noto Serif Devanagari',serif;font-size:0.95rem;}

  .ticker-wrap{background:var(--marigold);border-bottom:1px solid var(--marigold-deep);overflow:hidden;display:flex;}
  .ticker-label{flex:none;background:var(--red);color:#fff;font-weight:600;font-size:0.85rem;padding:8px 16px;display:flex;align-items:center;}
  .ticker-track{flex:1;overflow:hidden;position:relative;white-space:nowrap;display:flex;align-items:center;}
  .ticker-items{display:inline-flex;gap:48px;padding-inline-start:100%;animation:scroll-left 36s linear infinite;color:var(--navy-deep);font-size:0.9rem;font-weight:500;}
  @keyframes scroll-left{from{transform:translateX(0);}to{transform:translateX(-100%);}}
  @media (prefers-reduced-motion: reduce){.ticker-items{animation:none;padding-inline-start:16px;}}

  .cat-nav{background:var(--paper-dim);border-bottom:var(--rule);}
  .cat-nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 24px;}
  .cat-btn{background:none;border:none;padding:12px 14px;font-size:0.92rem;color:#4b4736;white-space:nowrap;border-bottom:2px solid transparent;}
  .cat-btn:hover{color:var(--ink);}
  .cat-btn.active{color:var(--navy-deep);border-bottom-color:var(--marigold-deep);font-weight:600;}

  .wrap{max-width:1200px;margin:0 auto;padding:32px 24px 60px;}
  .top-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:32px;align-items:start;}
  @media (max-width:860px){.top-grid{grid-template-columns:1fr;}}

  .hero{border:var(--rule);background:#fff;animation:hero-in 0.6s ease both;cursor:pointer;}
  @keyframes hero-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.hero{animation:none;}}
  .hero-art{height:260px;position:relative;background:radial-gradient(circle at 15% 25%, rgba(226,153,47,0.55), transparent 55%),radial-gradient(circle at 85% 75%, rgba(31,42,68,0.65), transparent 55%),linear-gradient(135deg,var(--navy) 0%, var(--navy-deep) 100%);display:flex;align-items:flex-end;padding:20px;}
  .hero-tag{background:var(--red);color:#fff;font-size:0.78rem;font-weight:600;padding:4px 10px;border-radius:2px;}
  .hero-body{padding:22px;}
  .hero-body .headline{font-size:clamp(1.5rem,3vw,2.05rem);line-height:1.3;}
  .hero-body p{color:#4b4736;margin:12px 0 0;font-size:1rem;}
  .byline{color:#7a7457;font-size:0.82rem;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .play-circle{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--navy-deep);}

  .live-panel{border:var(--rule);background:#fff;}
  .live-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:var(--rule);background:var(--navy-deep);color:var(--paper);}
  .live-head h2{font-size:1.05rem;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#5fd18a;display:inline-block;margin-inline-end:6px;box-shadow:0 0 0 0 rgba(95,209,138,0.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,209,138,0.55);}70%{box-shadow:0 0 0 8px rgba(95,209,138,0);}100%{box-shadow:0 0 0 0 rgba(95,209,138,0);}}
  .refresh-btn{background:transparent;border:1px solid #445;color:var(--paper);font-size:0.76rem;padding:4px 9px;border-radius:3px;}
  .refresh-btn:hover{border-color:var(--marigold);color:var(--marigold);}
  .live-list{list-style:none;margin:0;padding:0;}
  .live-list li{padding:12px 16px;border-bottom:var(--rule);font-size:0.9rem;}
  .live-list li:last-child{border-bottom:none;}
  .live-time{color:var(--marigold-deep);font-size:0.76rem;font-weight:600;display:block;margin-bottom:3px;}
  .live-note{padding:10px 16px;font-size:0.78rem;color:#8a836a;border-top:var(--rule);}

  .trending-panel{border:var(--rule);background:#fff;margin-top:22px;}
  .trending-head{padding:12px 16px;border-bottom:var(--rule);background:var(--red);color:#fff;font-size:1rem;font-family:'Noto Serif Devanagari',serif;}
  .trending-list{list-style:none;margin:0;padding:0;counter-reset:trend;}
  .trending-list li{padding:10px 16px;border-bottom:var(--rule);font-size:0.88rem;display:flex;gap:10px;align-items:baseline;cursor:pointer;}
  .trending-list li:last-child{border-bottom:none;}

  function startCountdown(seconds){
    let remaining = seconds;

    const tick = ()=>{
      const m = Math.floor(remaining/60), s = remaining%60;
      $('#statNext').textContent = m + ':' + String(s).padStart(2,'0');
      remaining = remaining<=0 ? seconds : remaining-1;
    };
    tick();
    countdownTimer = setInterval(tick, 1000);

  async function fetchAutoUpdate(){
    $('#liveNote').textContent = '…';
    try{
      const feedUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://feeds.bbci.co.uk/hindi/india/rss.xml');
      const res = await fetch(feedUrl);
      if(!res.ok) throw new Error('feed unavailable');
      const data = await res.json();
      if(data && Array.isArray(data.items) && data.items.length){
        data.items.slice(0,3).forEach(item=> pushLive(item.title));
        $('#liveNote').textContent = tr('note_live');
      } else throw new Error('empty feed');
    }catch(err){
      pushLive(liveHeadlinePool[Math.floor(Math.random()*liveHeadlinePool.length)]);
      $('#liveNote').textContent = tr('note_fallback');
    }
    renderTicker(); renderStats(); startCountdown(180);
  }

    $('#modalTitle').textContent = a.title;
    $('#modalByline').textContent = `${a.author||tr('byline_desk')} · ${a.time||tr('time_now')}`;
    $('#modalBody').textContent = a.body || a.summary;

    const vid = youtubeId(a.video);
    const videoBox = $('#modalVideo');
    if(vid){ videoBox.style.display='block'; videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen title="${escapeHtml(a.title)}"></iframe>`; }
    else { videoBox.style.display='none'; videoBox.innerHTML=''; }

    $('#likeCount').textContent = likeCounts[id]||0;
    $('#likeBtn').classList.toggle('liked', likedByMe.has(id));
    $('#viewCountLine').textContent = `👁 ${viewCounts[id]} ${tr('views')}`;

    renderComments(id);
    $('#modalOverlay').classList.add('open');
    renderGrid(); renderHero(); renderTrending();
  }
  function closeModal(){
    $('#modalOverlay').classList.remove('open');
    $('#modalVideo').innerHTML = '';
    activeArticleId = null;
  }
  $('#closeModalBtn').addEventListener('click', closeModal);
  $('#modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

  $('#likeBtn').addEventListener('click', async ()=>{
    if(!activeArticleId || likedByMe.has(activeArticleId)) return;
    likedByMe.add(activeArticleId);
    likeCounts[activeArticleId] = (likeCounts[activeArticleId]||0)+1;
    $('#likeCount').textContent = likeCounts[activeArticleId];
    $('#likeBtn').classList.add('liked');
    await saveEngagement();
    renderTrending();
  });

  $('#shareBtn').addEventListener('click', async ()=>{
    const a = articles.find(x=>x.id===activeArticleId);
    const shareText = a ? a.title : 'खबरनामा';
    try{
      if(navigator.share){ await navigator.share({title:shareText, text:shareText}); return; }
    }catch(e){}
    try{ await navigator.clipboard.writeText(shareText); }catch(e){}
    const btn = $('#shareBtn');
    const original = btn.textContent;
    btn.textContent = '✓ ' + tr('share_done');
    setTimeout(()=> btn.textContent = original, 2000);
  });

  function renderComments(id){
    const list = comments[id] || [];
    $('#commentsList').innerHTML = list.length ? list.map(c=>`
      <div class="comment-item"><strong>${escapeHtml(c.name)}</strong><span class="comment-time">${c.time}</span><div>${escapeHtml(c.text)}</div></div>
    `).join('') : `<div style="color:#8a836a;font-size:0.85rem;">${tr('no_comments')}</div>`;
  }
  $('#commentForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!activeArticleId) return;
    const name = $('#c-name').value.trim() || tr('c_name_ph');
    const text = $('#c-text').value.trim();
    if(!text) return;
    if(!comments[activeArticleId]) comments[activeArticleId] = [];
    comments[activeArticleId].unshift({name, text, time:nowLabel()});
    await saveComments();
    renderComments(activeArticleId);
    $('#c-text').value = '';
  });

  // ---- Admin ----
  const adminPanel = $('#adminPanel');
  $('#adminToggleBtn').addEventListener('click', ()=>{
    adminPanel.classList.toggle('open');
    if(adminPanel.classList.contains('open')) adminPanel.scrollIntoView({behavior:'smooth', block:'start'});
  });
  $('#closeAdminBtn').addEventListener('click', ()=> adminPanel.classList.remove('open'));

  $('#newsForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const title = $('#f-title').value.trim();
    const summary = $('#f-summary').value.trim();
    const body = $('#f-body').value.trim();
    const author = $('#f-author').value.trim();
    const video = $('#f-video').value.trim();
    const cat = $('#f-cat').value;
    if(!title || !summary) return;

    const newArticle = { id:'custom-'+Date.now(), title, summary, body, cat, author: author||tr('byline_desk'), time: tr('time_now'), featured:true, video };
    articles.forEach(a=>a.featured=false);
    articles.unshift(newArticle);
    await saveArticles(getCustomArticles());

    renderHero(); renderGrid(); renderTicker(); renderStats(); buildSubjectStrip(); renderTrending();
    $('#statusMsg').textContent = tr('publish_success');
    $('#newsForm').reset();
    setTimeout(()=> $('#statusMsg').textContent='', 3500);
  });

  $('#refreshBtn').addEventListener('click', fetchAutoUpdate);

  (async function init(){
    $('#today-date').textContent = new Date().toLocaleDateString('hi-IN', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    await loadLangPref();
    setupLangSelect();
    await loadArticles();
    await loadEngagement();
    await loadFollows();
    applyLanguage();
    showCapsule();
    await fetchAutoUpdate();
    scheduleAuto();
  })();

})();
</script>
</body>
</html>
