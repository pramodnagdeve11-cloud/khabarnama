<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khabarnama - Latest News</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;color:#222}
header{background:#b40000;color:white;padding:18px;text-align:center}
nav{background:#222;padding:10px;display:flex;gap:8px;overflow:auto}
nav button{background:#444;color:#fff;border:0;padding:9px 14px;border-radius:5px;white-space:nowrap}
nav button.active{background:#d40000}
main{max-width:1000px;margin:20px auto;padding:0 12px}
#status{padding:10px;background:white;border-radius:6px;margin-bottom:15px}
.card{background:#fff;margin:12px 0;padding:16px;border-radius:8px;box-shadow:0 1px 5px #ccc}
.card h2{font-size:20px;margin:0 0 8px}
.card a{color:#b40000;text-decoration:none;font-weight:bold}
.meta{color:#777;font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<header><h1>📰 Khabarnama</h1><p>Latest News</p></header>
<nav id="cats"></nav>
<main>
<div id="status">News loading...</div>
<section id="news"></section>
</main>
<script>
const categories=["All","India","Madhya Pradesh","World","Sports","Entertainment","Business","Technology"];
let selected="All";
const cats=document.getElementById("cats");
categories.forEach(c=>{
 const b=document.createElement("button"); b.textContent=c;
 b.onclick=()=>{selected=c; renderButtons(); loadNews();}; cats.appendChild(b);
});
function renderButtons(){[...cats.children].forEach((b,i)=>b.classList.toggle("active",categories[i]===selected));}
async function loadNews(){
 document.getElementById("status").textContent="Latest news loading...";
 try{
  const r=await fetch("news.json?"+Date.now());
  const data=await r.json();
  const items=selected==="All"?data:data.filter(x=>x.category===selected);
  document.getElementById("status").textContent=`${items.length} news found • Last update: ${data.updated||"recent"}`;
  document.getElementById("news").innerHTML=items.map(x=>`
   <article class="card">
    <div class="meta">${x.category||"News"} • ${x.source||""} • ${x.date||""}</div>
    <h2>${escapeHtml(x.title)}</h2>
    <p>${escapeHtml(x.description||"")}</p>
    <a href="${x.url}" target="_blank" rel="noopener">पूरी खबर पढ़ें →</a>
   </article>`).join("") || "<div class='card'>इस category में अभी खबर नहीं है।</div>";
 }catch(e){document.getElementById("status").textContent="News file load नहीं हो पाई। GitHub Actions चलने के बाद फिर देखें।";}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
renderButtons();loadNews();
</script>
</body>
</html>
